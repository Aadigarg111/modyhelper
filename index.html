<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ModyHelper — B.Tech CSE Syllabus &amp; Student Portal | Mody University</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Merriweather', 'Georgia', 'serif']
          },
          colors: {
            mody: {
              green: '#15803d',
              darkgreen: '#14532d',
              lightgreen: '#f0fdf4',
              gold: '#d97706',
              amber: '#f59e0b',
              lightgold: '#fef3c7',
              navy: '#0f172a',
              cream: '#f8fafc'
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      transition: background-color 0.35s ease, color 0.35s ease;
    }
    /* Subtle Gemini-inspired ambient aurora backdrop */
    .ambient-aurora {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
      background: radial-gradient(circle at 15% 10%, rgba(16, 185, 129, 0.075), transparent 45%),
                  radial-gradient(circle at 85% 12%, rgba(99, 102, 241, 0.065), transparent 45%),
                  radial-gradient(circle at 50% 85%, rgba(217, 119, 6, 0.05), transparent 50%);
    }
    .ambient-orb {
      position: absolute;
      border-radius: 9999px;
      filter: blur(90px);
      opacity: 0.42;
      will-change: transform;
      animation: auroraDrift 22s ease-in-out infinite alternate;
    }
    .ambient-orb-1 {
      width: 44vw;
      height: 44vw;
      max-width: 540px;
      max-height: 540px;
      top: -12%;
      left: -8%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.22) 0%, rgba(20, 184, 166, 0.08) 65%, transparent 100%);
    }
    .ambient-orb-2 {
      width: 40vw;
      height: 40vw;
      max-width: 500px;
      max-height: 500px;
      top: -10%;
      right: -8%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.16) 0%, rgba(56, 189, 248, 0.08) 65%, transparent 100%);
      animation-duration: 27s;
      animation-direction: alternate-reverse;
    }
    .ambient-orb-3 {
      width: 36vw;
      height: 36vw;
      max-width: 440px;
      max-height: 440px;
      bottom: -14%;
      left: 28%;
      background: radial-gradient(circle, rgba(217, 119, 6, 0.13) 0%, rgba(16, 185, 129, 0.06) 65%, transparent 100%);
      animation-duration: 31s;
    }
    @keyframes auroraDrift {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(3%, 4%, 0) scale(1.06); }
      100% { transform: translate3d(-3%, 2%, 0) scale(0.97); }
    }
    @keyframes geminiShimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .gemini-accent-line {
      height: 2px;
      width: 100%;
      background: linear-gradient(90deg, rgba(21,128,61,0.15), rgba(16,185,129,0.65), rgba(217,119,6,0.65), rgba(99,102,241,0.55), rgba(21,128,61,0.15));
      background-size: 220% 100%;
      animation: geminiShimmer 12s ease-in-out infinite;
    }
    .gemini-title-shimmer {
      background: linear-gradient(120deg, #0f172a 0%, #14532d 38%, #0d9488 68%, #b45309 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: geminiShimmer 14s ease-in-out infinite;
    }
    html.dark .gemini-title-shimmer {
      background: linear-gradient(120deg, #f8fafc 0%, #6ee7b7 38%, #38bdf8 68%, #fbbf24 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sheet-paper {
      font-family: 'Merriweather', 'Times New Roman', serif;
      background: #ffffff;
      box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.08), 0 0 1px 1px rgba(15, 23, 42, 0.06);
    }
    .mody-gradient {
      background: linear-gradient(135deg, #14532d 0%, #15803d 55%, #0f766e 100%);
    }
    .gold-gradient {
      background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
    }

    /* =====================================================================
       PREMIUM DARK MODE SYSTEM (Ergonomic Obsidian & Slate, Zero Eye Strain)
       ===================================================================== */
    html.dark body {
      background-color: #0b0f17;
      color: #e2e8f0;
    }
    html.dark .ambient-aurora {
      background: radial-gradient(circle at 15% 10%, rgba(16, 185, 129, 0.11), transparent 48%),
                  radial-gradient(circle at 85% 12%, rgba(56, 189, 248, 0.09), transparent 48%),
                  radial-gradient(circle at 50% 88%, rgba(217, 119, 6, 0.07), transparent 52%);
    }
    html.dark .ambient-orb { opacity: 0.32; }
    html.dark header {
      background-color: rgba(11, 15, 23, 0.82) !important;
      border-color: rgba(51, 65, 85, 0.55) !important;
    }
    html.dark footer {
      background-color: rgba(15, 23, 42, 0.78) !important;
      border-color: rgba(51, 65, 85, 0.55) !important;
    }
    /* Surfaces (exclude print sheet-paper) */
    html.dark .bg-white:not(.sheet-paper) { background-color: #131b2b !important; }
    html.dark .bg-white\/90, html.dark .bg-white\/85, html.dark .bg-white\/75 { background-color: rgba(19, 27, 43, 0.88) !important; }
    html.dark .bg-slate-50, html.dark .bg-slate-50\/50, html.dark .bg-slate-50\/60 { background-color: rgba(15, 23, 42, 0.65) !important; }
    html.dark .bg-slate-100, html.dark .bg-slate-100\/80 { background-color: rgba(30, 41, 59, 0.78) !important; }
    html.dark .bg-slate-200 { background-color: #334155 !important; }
    html.dark .from-slate-50 {
      --tw-gradient-from: rgba(30, 41, 59, 0.55) !important;
      --tw-gradient-to: rgba(19, 27, 43, 0.9) !important;
    }
    /* Tinted semantic surfaces in dark mode */
    html.dark .bg-mody-lightgreen,
    html.dark .bg-emerald-50,
    html.dark .bg-emerald-50\/40,
    html.dark .bg-emerald-50\/50,
    html.dark .bg-emerald-50\/70 { background-color: rgba(16, 185, 129, 0.12) !important; }
    html.dark .bg-emerald-100, html.dark .bg-emerald-100\/80 { background-color: rgba(16, 185, 129, 0.2) !important; }
    html.dark .bg-amber-50, html.dark .bg-amber-50\/50, html.dark .bg-amber-50\/70 { background-color: rgba(245, 158, 11, 0.12) !important; }
    html.dark .bg-amber-100, html.dark .bg-amber-200 { background-color: rgba(245, 158, 11, 0.22) !important; }
    html.dark .bg-blue-50\/70, html.dark .bg-blue-100 { background-color: rgba(59, 130, 246, 0.15) !important; }
    html.dark .bg-purple-50\/70, html.dark .bg-purple-100 { background-color: rgba(168, 85, 247, 0.15) !important; }
    html.dark .bg-indigo-100 { background-color: rgba(99, 102, 241, 0.18) !important; }
    html.dark .bg-fuchsia-100 { background-color: rgba(217, 70, 239, 0.18) !important; }
    html.dark .bg-teal-100 { background-color: rgba(20, 184, 166, 0.18) !important; }
    html.dark .from-mody-lightgreen\/70 {
      --tw-gradient-from: rgba(16, 185, 129, 0.1) !important;
      --tw-gradient-to: rgba(245, 158, 11, 0.06) !important;
    }

    /* Typography in dark mode (keep .sheet-paper dark-on-light for authentic paper preview) */
    html.dark :not(.sheet-paper) > .text-slate-900,
    html.dark h1.text-slate-900, html.dark h2.text-slate-900, html.dark h3.text-slate-900, html.dark h4.text-slate-900,
    html.dark td.text-slate-900, html.dark span.text-slate-900 { color: #f1f5f9 !important; }
    html.dark .text-slate-800 { color: #e2e8f0 !important; }
    html.dark .text-slate-700 { color: #cbd5e1 !important; }
    html.dark .text-slate-600 { color: #94a3b8 !important; }
    html.dark .text-slate-500 { color: #64748b !important; }
    html.dark .text-mody-darkgreen { color: #6ee7b7 !important; }
    html.dark .text-mody-green { color: #34d399 !important; }
    html.dark .text-emerald-700, html.dark .text-emerald-800\/80, html.dark .text-emerald-900 { color: #6ee7b7 !important; }
    html.dark .text-amber-800, html.dark .text-amber-800\/80, html.dark .text-amber-900, html.dark .text-amber-950 { color: #fcd34d !important; }
    html.dark .text-blue-700, html.dark .text-blue-800, html.dark .text-blue-800\/80, html.dark .text-blue-900 { color: #93c5fd !important; }
    html.dark .text-purple-700, html.dark .text-purple-800, html.dark .text-purple-800\/80, html.dark .text-purple-900 { color: #d8b4fe !important; }
    html.dark .text-indigo-900 { color: #a5b4fc !important; }
    html.dark .text-fuchsia-900 { color: #f0abfc !important; }
    html.dark .text-teal-900 { color: #5eead4 !important; }

    /* Borders & Inputs in dark mode */
    html.dark .border-slate-100 { border-color: rgba(51, 65, 85, 0.38) !important; }
    html.dark .border-slate-200,
    html.dark .border-slate-200\/70,
    html.dark .border-slate-200\/80,
    html.dark .border-slate-200\/90,
    html.dark .border-slate-300 { border-color: rgba(51, 65, 85, 0.68) !important; }
    html.dark .border-emerald-200,
    html.dark .border-emerald-200\/80,
    html.dark .border-emerald-200\/90,
    html.dark .border-emerald-300,
    html.dark .border-emerald-300\/80 { border-color: rgba(16, 185, 129, 0.35) !important; }
    html.dark .border-amber-200,
    html.dark .border-amber-200\/60,
    html.dark .border-amber-300,
    html.dark .border-amber-300\/80 { border-color: rgba(245, 158, 11, 0.38) !important; }
    html.dark .border-blue-200, html.dark .border-blue-300 { border-color: rgba(59, 130, 246, 0.35) !important; }
    html.dark .border-purple-200, html.dark .border-purple-300 { border-color: rgba(168, 85, 247, 0.35) !important; }
    html.dark input, html.dark select {
      background-color: #0f172a !important;
      color: #f1f5f9 !important;
      border-color: rgba(71, 85, 105, 0.75) !important;
    }
    /* Keep official university paper sheet crisp & authentic even in dark mode */
    html.dark .sheet-paper, html.dark .sheet-paper * {
      color: #0f172a;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.95) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-view-in {
      animation: fadeSlideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .animate-card-in {
      animation: fadeSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .animate-modal-in {
      animation: modalPop 0.22s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @media (prefers-reduced-motion: reduce) {
      .animate-view-in, .animate-card-in, .animate-modal-in {
        animation: none !important;
      }
    }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff; }
      .sheet-paper { box-shadow: none; border: none; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-amber-200 selection:text-slate-900 relative">

  <!-- SUBTLE GEMINI-INSPIRED AMBIENT AURORA BACKDROP -->
  <div class="ambient-aurora no-print" aria-hidden="true">
    <div class="ambient-orb ambient-orb-1"></div>
    <div class="ambient-orb ambient-orb-2"></div>
    <div class="ambient-orb ambient-orb-3"></div>
  </div>

  <!-- MAIN NAVIGATION HEADER -->
  <header class="bg-white/90 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-30 no-print">
    <div class="gemini-accent-line" aria-hidden="true"></div>
    <div class="max-w-7xl mx-auto px-3.5 sm:px-6 py-2.5 sm:py-3 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-2.5">

      <div class="flex items-center justify-between gap-3">
        <button type="button" onclick="navigateHome()" class="flex items-center gap-2.5 text-left group focus:outline-none active:scale-[0.98] transition">

            <span class="font-serif font-bold text-base sm:text-lg tracking-tighter text-amber-300">mu</span>
          </div>
          <div>
            <div class="flex items-center gap-1.5">
              <span class="font-extrabold text-base sm:text-lg tracking-tight text-mody-darkgreen">Mody<span class="text-mody-gold">Helper</span></span>
              <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-mody-lightgreen text-mody-green border border-emerald-200/80">B.Tech CSE</span>

            <svg class="w-3.5 h-3.5 text-mody-green" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>

      </div>

      <!-- Primary Navigation Tabs (Horizontally scrollable on mobile) -->
      <nav class="flex items-center gap-1 bg-slate-100/80 p-1 rounded-xl border border-slate-200/70 overflow-x-auto no-scrollbar max-w-full">
        <button type="button" id="navBtnDashboard" onclick="switchMainView('dashboard')" class="px-3 py-2 sm:py-1.5 rounded-lg text-xs font-semibold transition bg-mody-green text-white shadow-sm whitespace-nowrap active:scale-[0.97]">
          My Semester
        </button>
        <button type="button" id="navBtnAllCourses" onclick="switchMainView('all-courses')" class="px-3 py-2 sm:py-1.5 rounded-lg text-xs font-semibold transition text-slate-600 hover:text-slate-900 hover:bg-white whitespace-nowrap active:scale-[0.97]">
          All Subjects (66)
        </button>
        <button type="button" id="navBtnElectives" onclick="switchMainView('electives')" class="px-3 py-2 sm:py-1.5 rounded-lg text-xs font-semibold transition text-slate-600 hover:text-slate-900 hover:bg-white whitespace-nowrap active:scale-[0.97]">

        </button>
        <button type="button" id="navBtnChanges" onclick="switchMainView('changes')" class="px-3 py-2 sm:py-1.5 rounded-lg text-xs font-semibold transition text-slate-600 hover:text-slate-900 hover:bg-white flex items-center gap-1.5 whitespace-nowrap active:scale-[0.97]">
          <span>Updates</span>
          <span class="px-1.5 py-0.2 bg-amber-100 text-amber-800 rounded-full text-[10px] font-bold">New</span>

        <button type="button" id="navBtnCalculator" onclick="switchMainView('calculator')" class="px-3 py-2 sm:py-1.5 rounded-lg text-xs font-semibold transition text-slate-600 hover:text-slate-900 hover:bg-white whitespace-nowrap active:scale-[0.97]">

      <!-- Desktop Theme Toggle + Semester Switcher (shown on lg+) -->

        <button type="button" onclick="toggleTheme()" class="p-2 rounded-xl border border-slate-200/90 bg-slate-100/80 text-slate-700 hover:bg-slate-200/70 active:scale-[0.96] transition flex items-center justify-center" title="Toggle Dark / Light Mode" aria-label="Toggle Dark / Light Mode">

  </header>

  <!-- MAIN CONTENT CONTAINER -->

        <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-mody-darkgreen to-mody-green border border-amber-400/70 flex items-center justify-center text-amber-300 font-serif font-bold text-xs">mu</div>

  <!-- APPLICATION DATA & LOGIC -->
  <script>
    // =========================================================================
    // 1. CURRICULUM SUMMARY TABLES & 2025-2029 CHANGES DATA
    // =========================================================================
    const CURRICULUM_COMPONENTS = [
      { id: 1, name: "University Core", courses2023: 4, credits2023: 8, courses2025: 3, credits2025: 6, code: "UC" },
      { id: 2, name: "University Elective", courses2023: 2, credits2023: 6, courses2025: 2, credits2025: 6, code: "UE" },
      { id: 3, name: "Basic Science", courses2023: 9, credits2023: 24, courses2025: 9, credits2025: 23, code: "BS" },
      { id: 4, name: "Engineering Science", courses2023: 9, credits2023: 21, courses2025: 9, credits2025: 18, code: "ES" },

      { id: 6, name: "Program Elective / MOOCs", courses2023: 5, credits2023: 15, courses2025: 5, credits2025: 15, code: "PE" },
      { id: 7, name: "Project / Summer Internship Project", courses2023: 7, credits2023: 17, courses2025: 11, credits2025: 21, code: "Proj/SIP" },
      { id: 8, name: "Proficiency (Non-Graded)", courses2023: 6, credits2023: 6, courses2025: 6, credits2025: 6, code: "Prof" }

    function setCookie(name, value, days) {
      try {
        const maxAge = (days || 365) * 24 * 60 * 60;
        document.cookie = encodeURIComponent(name) + "=" + encodeURIComponent(value) + "; max-age=" + maxAge + "; path=/; SameSite=Lax";
      } catch (e) {}
      try {
        localStorage.setItem(name, value);
      } catch (e) {}
    }

    function getCookie(name) {
      try {
        const nameEQ = encodeURIComponent(name) + "=";
        const ca = document.cookie ? document.cookie.split(";") : [];
        for (let i = 0; i < ca.length; i++) {
          let c = ca[i].trim();
          if (c.indexOf(nameEQ) === 0) {
            return decodeURIComponent(c.substring(nameEQ.length, c.length));
          }
        }
      } catch (e) {}
      try {
        const lsVal = localStorage.getItem(name);
        if (lsVal !== null) return lsVal;
      } catch (e) {}
      return null;
    }

    function loadSavedState() {
      const savedSem = getCookie("modyhelper_sem");
      const savedBatch = getCookie("modyhelper_batch");
      const savedProgress = getCookie("modyhelper_progress");

      if (savedBatch === "2025-2029" || savedBatch === "2023-2027") {
        state.selectedBatch = savedBatch;
      }
      if (savedProgress) {
        try {
          state.completedUnits = JSON.parse(savedProgress) || {};
        } catch (e) {
          state.completedUnits = {};
        }
      }
      const savedAtt = getCookie("modyhelper_attendance");
      if (savedAtt) {
        try {
          state.attendance = JSON.parse(savedAtt) || {};
        } catch (e) {
          state.attendance = {};
        }
      }

      if (savedSem && !isNaN(parseInt(savedSem, 10))) {
        const s = parseInt(savedSem, 10);
        if (s >= 1 && s <= 8) {
          state.selectedSem = s;
          syncHeaderSelects();
          updateCookieBadge();
          return true; // Has saved semester cookie
        }
      }
      syncHeaderSelects();
      updateCookieBadge();
      return false; // First visit -> open modal
    }

    function getCourseCodeForBatch(course) {
      if (state.selectedBatch === "2025-2029" && course.code2025) return course.code2025;
      if (state.selectedBatch === "2023-2027" && course.code2023) return course.code2023;
      return course.code;
    }

    function getCourseCreditsForBatch(course) {
      if (state.selectedBatch === "2023-2027" && typeof course.credits2023 === "number") {
        return course.credits2023;
      }
      return course.credits;
    }

    function getCourseTForBatch(course) {
      if (state.selectedBatch === "2023-2027" && typeof course.T2023 === "number") {
        return course.T2023;
      }
      return course.T;
    }

    function getCourseWeightageForBatch(course) {
      return state.selectedBatch === "2025-2029" ? course.weightage2025 : course.weightage2023;
    }

    function getCoursesForSemester(semNum) {
      return COURSES.filter(c => c.sem === Number(semNum) && c.batches.includes(state.selectedBatch));
    }

    function getCourseProgress(course) {
      if (!course.units || course.units.length === 0) return { done: 0, total: 0, pct: 0 };
      let done = 0;
      course.units.forEach(u => {
        if (state.completedUnits[course.id + "_" + u.num]) done++;
      });
      return {
        done,
        total: course.units.length,
        pct: Math.round((done / course.units.length) * 100)
      };
    }

        totalEl.textContent = tot.toFixed(1) + " / 100";
        let g = "F (< 40)";

        state.attendance[courseId] = { attended: 0, total: 0 };
      }
      const rec = state.attendance[courseId];
      if (action === "present") {
        rec.attended += 1;
        rec.total += 1;
      } else if (action === "absent") {
        rec.total += 1;
      } else if (action === "undo") {
        if (rec.total > 0) {
          if (rec.attended === rec.total) rec.attended = Math.max(0, rec.attended - 1);
          rec.total = Math.max(0, rec.total - 1);
        }
      } else if (action === "reset") {
        delete state.attendance[courseId];
      }
      setCookie("modyhelper_attendance", JSON.stringify(state.attendance), 365);
      renderApp();
    };

    // ---------------- VIEW 3: ALL SUBJECTS DIRECTORY (SEARCH & FILTER) ----------------
    function renderAllCoursesView() {
      const q = (state.searchQuery || "").trim().toLowerCase();
      const filtered = COURSES.filter(c => {
        if (state.categoryFilter !== "ALL" && c.category !== state.categoryFilter) return false;
        if (!q) return true;
        const inCode = c.code.toLowerCase().includes(q) || (c.code2025 && c.code2025.toLowerCase().includes(q));
        const inTitle = c.title.toLowerCase().includes(q);
        const inUnits = c.units.some(u => u.title.toLowerCase().includes(q) || u.content.toLowerCase().includes(q));
        const inBooks = (c.textBooks || []).some(b => b.toLowerCase().includes(q));
        return inCode || inTitle || inUnits || inBooks;
      });

      const cats = ["ALL", "PC", "BS", "ES", "UC", "PE", "UE", "Proj/SIP", "Prof"];

      return `
        <div class="space-y-6">
          <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900">Complete B.Tech CSE Course Directory (${COURSES.length} Subjects)</h1>
                <p class="text-xs text-slate-500 mt-1">Search across every subject code, title, unit topic, or textbook author from Semester 1 to Semester 8.</p>
              </div>
              <div class="w-full md:w-80">
                <input id="directorySearchInput" type="text" value="${state.searchQuery.replace(/"/g, '&quot;')}" oninput="handleDirectorySearch(this.value)" placeholder="Search code, subject, topic (e.g. Pointer, Turing, IoT)..." class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs focus:outline-none focus:border-mody-green" />
              </div>
            </div>

            <div class="flex flex-wrap gap-1.5 mt-4 pt-3 border-t border-slate-100">
              ${cats.map(cat => `
                <button type="button" onclick="handleCategoryFilter('${cat}')" class="px-3 py-1 rounded-lg text-xs font-bold transition ${state.categoryFilter === cat ? 'bg-mody-green text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
                  ${cat === 'ALL' ? 'All Categories' : cat}
                </button>
              `).join("")}
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            ${filtered.map(c => {
              const code = getCourseCodeForBatch(c);
              const cr = getCourseCreditsForBatch(c);
              const w = getCourseWeightageForBatch(c);
              return `
                <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm hover:border-mody-green transition flex flex-col justify-between">
                  <div>
                    <div class="flex items-center justify-between gap-2">
                      <span class="font-mono font-extrabold text-xs px-2 py-0.5 rounded bg-mody-green text-white">${code}</span>
                      <span class="text-[11px] font-bold text-slate-500">Sem ${c.sem} &bull; ${cr} Cr</span>
                    </div>
                    <h3 class="font-bold text-sm text-slate-900 mt-2">${c.title}</h3>
                    <p class="text-[11px] text-slate-500 mt-1">Marks: CW ${w.CW || 0} | MTE ${w.MTE || 0} | PBL ${w.PBL || 0} | ETE ${w.ETE || 0}</p>
                    <p class="text-[11px] text-slate-600 mt-2 line-clamp-2">
                      ${c.units.map(u => `U${u.num}: ${u.title}`).join(" • ")}
                    </p>
                  </div>
                  <div class="mt-4 pt-2.5 border-t border-slate-100 flex items-center justify-between">
                    ${getCategoryBadgeHtml(c.category)}
                    <button type="button" onclick="openSubjectPage('${c.id}', 'interactive')" class="text-xs font-extrabold text-mody-green hover:underline">
                      Open Syllabus &rarr;
                    </button>
                  </div>
                </div>
              `;

                        <td class="py-2.5 px-4 font-bold text-slate-900">${comp.name} (${comp.code})</td>
                        <td class="py-2.5 px-4 text-center">${comp.courses2023} Courses</td>
                        <td class="py-2.5 px-4 text-center font-semibold">${comp.credits2023}</td>
                        <td class="py-2.5 px-4 text-center bg-amber-50/50 font-semibold">${comp.courses2025} Courses</td>
                        <td class="py-2.5 px-4 text-center bg-amber-50/50 font-extrabold text-mody-green">${comp.credits2025}</td>
                        <td class="py-2.5 px-4 text-center font-bold ${diff > 0 ? 'text-emerald-700' : diff < 0 ? 'text-rose-600' : 'text-slate-400'}">
                          ${diff === 0 ? 'No Change' : (diff > 0 ? '+' + diff + ' Cr' : diff + ' Cr')}
                        </td>
                      </tr>
                    `;
                  }).join("")}
                  <tr class="bg-slate-100 font-extrabold text-slate-900">
                    <td class="py-2.5 px-4" colspan="2">Total Program Credits</td>
                    <td class="py-2.5 px-4 text-center">72 Courses</td>
                    <td class="py-2.5 px-4 text-center">160 Credits</td>
                    <td class="py-2.5 px-4 text-center">76 Courses</td>
                    <td class="py-2.5 px-4 text-center text-mody-green">160 Credits</td>
                    <td class="py-2.5 px-4 text-center">Balanced (160)</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- Semester-by-Semester Detailed Change Cards -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            ${NEW_CHANGES_SUMMARY.map(item => `
              <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm flex flex-col justify-between">
                <div>
                  <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-extrabold uppercase px-2.5 py-0.5 rounded bg-mody-green text-white">Semester ${item.sem}</span>
                    <button type="button" onclick="handleHeaderSemesterChange(${item.sem})" class="text-xs font-bold text-mody-gold hover:underline">Open Sem ${item.sem} &rarr;</button>
                  </div>
                  <h3 class="font-extrabold text-base text-slate-900 mb-2">${item.title}</h3>
                  <ul class="space-y-2 text-xs text-slate-700 list-disc list-inside leading-relaxed">
                    ${item.changes.map(ch => `<li>${ch}</li>`).join("")}
                  </ul>
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    // ---------------- VIEW 6: SGPA & CREDIT CALCULATOR ----------------
    function renderCalculatorView() {
      const sem = state.selectedSem;
      const courses = getCoursesForSemester(sem).filter(c => c.category !== "Prof"); // Graded courses
      let totalCr = 0;
      let weightedSum = 0;

      courses.forEach(c => {
        const cr = getCourseCreditsForBatch(c);
        const gp = state.sgpaGrades[c.id] !== undefined ? state.sgpaGrades[c.id] : 9;
        totalCr += cr;
        weightedSum += cr * gp;
      });
      const sgpa = totalCr > 0 ? (weightedSum / totalCr).toFixed(2) : "0.00";

      return `
        <div class="space-y-6">
          <div class="mody-gradient rounded-2xl p-6 text-white shadow-md flex flex-wrap items-center justify-between gap-4">
            <div>
              <h1 class="text-2xl font-extrabold">Semester ${sem} SGPA &amp; Credit Weightage Calculator</h1>
              <p class="text-xs sm:text-sm text-emerald-100 mt-1">
                Automatically loaded with your saved Semester ${sem} (${state.selectedBatch}) graded subjects and official credits.
              </p>
            </div>
            <div class="bg-white/15 border border-amber-300/50 rounded-2xl px-5 py-3 text-center">
              <span class="block text-[10px] uppercase tracking-wider text-amber-200 font-bold">Estimated Semester ${sem} SGPA</span>
              <span class="text-3xl font-extrabold text-amber-300">${sgpa} / 10.00</span>
              <span class="block text-[11px] text-emerald-100">Graded Credits: ${totalCr}</span>
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-xs">
                <thead>
                  <tr class="bg-slate-100 border-b border-slate-300 font-extrabold uppercase text-slate-700">
                    <th class="py-3 px-4">Course Code</th>
                    <th class="py-3 px-4">Subject Title</th>
                    <th class="py-3 px-4 text-center">Marks Split (CW/MTE/PBL/ETE)</th>
                    <th class="py-3 px-4 text-center">Credits (Ci)</th>
                    <th class="py-3 px-4 text-center">Expected Grade Point (Gi)</th>
                    <th class="py-3 px-4 text-center">Credit Points (Ci &times; Gi)</th>
                  </tr>
                </thead>
                <tbody>
                  ${courses.map(c => {
                    const code = getCourseCodeForBatch(c);
                    const cr = getCourseCreditsForBatch(c);
                    const w = getCourseWeightageForBatch(c);
                    const gp = state.sgpaGrades[c.id] !== undefined ? state.sgpaGrades[c.id] : 9;
                    return `
                      <tr class="border-b border-slate-200">
                        <td class="py-3 px-4 font-mono font-bold text-mody-green">${code}</td>
                        <td class="py-3 px-4 font-bold text-slate-900">
                          <button type="button" onclick="openSubjectPage('${c.id}', 'interactive')" class="hover:underline text-left">${c.title}</button>
                        </td>
                        <td class="py-3 px-4 text-center text-slate-600">${w.CW || 0} / ${w.MTE || 0} / ${w.PBL || 0} / ${w.ETE || 0}</td>
                        <td class="py-3 px-4 text-center font-extrabold text-slate-900">${cr}</td>
                        <td class="py-3 px-4 text-center">
                          <select onchange="updateSgpaGrade('${c.id}', this.value)" class="border border-slate-300 rounded-lg px-2.5 py-1 font-bold text-slate-800 bg-white">
                            <option value="10" ${gp === 10 ? 'selected' : ''}>O (10 GP)</option>
                            <option value="9" ${gp === 9 ? 'selected' : ''}>A+ (9 GP)</option>
                            <option value="8" ${gp === 8 ? 'selected' : ''}>A (8 GP)</option>
                            <option value="7" ${gp === 7 ? 'selected' : ''}>B+ (7 GP)</option>
                            <option value="6" ${gp === 6 ? 'selected' : ''}>B (6 GP)</option>
                            <option value="5" ${gp === 5 ? 'selected' : ''}>C (5 GP)</option>
                            <option value="4" ${gp === 4 ? 'selected' : ''}>P (4 GP)</option>
                          </select>
                        </td>
                        <td class="py-3 px-4 text-center font-extrabold text-mody-green">${cr * gp}</td>
                      </tr>
                    `;
                  }).join("")}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 8. THEME (DARK / LIGHT) & INITIALIZATION ON LOAD
    // =========================================================================
    function applyTheme(theme) {
      const isDark = theme === "dark";
      document.documentElement.classList.toggle("dark", isDark);
      const sunSvg = '<svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>';
      const moonSvg = '<svg class="w-4 h-4 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>';
      document.querySelectorAll(".theme-icon-slot").forEach(el => {
        el.innerHTML = isDark ? sunSvg : moonSvg;
      });
    }

    window.toggleTheme = function() {
      const isDark = document.documentElement.classList.contains("dark");
      const next = isDark ? "light" : "dark";
      setCookie("modyhelper_theme", next, 365);
      applyTheme(next);
    };

    window.addEventListener("DOMContentLoaded", function() {
      const savedTheme = getCookie("modyhelper_theme") || "dark";
      applyTheme(savedTheme);
      const hasSavedCookie = loadSavedState();
      renderApp();
      if (!hasSavedCookie) {
        openSemesterModal();
      }
    });
  </script>
</body>
</html>
